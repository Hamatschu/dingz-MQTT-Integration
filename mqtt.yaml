# =========================================================================================
# Binärsensoren
# =========================================================================================
binary_sensor:

  # ----------------------------------------------------------
  # PIR
  #   s  = somebody        => ON
  #   ss = still somebody  => ON
  #   n  = nobody          => OFF
  # ----------------------------------------------------------
  - name: "PIR"
    unique_id: "dingz_f008d1c578c8_pir_0"
    state_topic: "dingz/f008d1c578c8/dz1f-pir/event/pir/0"
    value_template: >
      {% if value is defined and value in ['s', 'ss'] %}
        on
      {% else %}
        off
      {% endif %}
    payload_on: "on"
    payload_off: "off"
    device_class: motion
    device: *f008d1c578c8

  # Verbindungsstatus
  - name: "Online Status"
    unique_id: "dingz_f008d1c578c8_online"
    state_topic: "dingz/f008d1c578c8/online"
    payload_on: "true"
    payload_off: "false"
    device_class: connectivity
    entity_category: diagnostic
    device: *f008d1c578c8
