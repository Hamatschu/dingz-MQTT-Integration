# dingz inteligente Schalter - MQTT Integration by Hamatschu & Gemini
#
# Aufgebaut auf dingz MQTT topics FW 2.1.58 V1.03 - Jan 2025 mit HAOS 2026.8
#
# =========================================================================================
# Lichter / Dimmer
# =========================================================================================
light:

  # ----------------------------------------------------------
  # Bei deaktivierten Dimmumg, hat der Dimmmbalken in HA keine funktion, wird aber angezeigt.
  # Um aus dimmbaren Licht Entitäten reine Ein/Aus-Steckdosen Schalter zu machen,
  # kannst du den Abschnitt Schalter nutzen.
  # ----------------------------------------------------------
  - name: "Licht 1" # Ausgaung 1 / Imput 4
    unique_id: "dingz_f008d1c578c8_light_0"
    state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/0"
    command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/0"
    state_value_template: '{"turn":"{{ value_json.turn }}"}'
    brightness_state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/0"
    brightness_command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/0"
    brightness_value_template: "{{ value_json.brightness }}"
    brightness_scale: 100
    on_command_type: 'brightness'
    payload_on: '{"turn":"on"}'
    payload_off: '{"turn":"off"}'
    brightness_command_template: '{"turn":"on","brightness":{{ value }}}'
    device: &f008d1c578c8
      identifiers: "dingz_f008d1c578c8"
      name: "dingz_f008d1c578c8"
      manufacturer: "dingz"
      model: "dz1f-pir"

  - name: "Licht 2" # Ausgaung 2
    unique_id: "dingz_f008d1c578c8_light_1"
    state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/1"
    command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/1"
    state_value_template: '{"turn":"{{ value_json.turn }}"}'
    brightness_state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/1"
    brightness_command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/1"
    brightness_value_template: "{{ value_json.brightness }}"
    brightness_scale: 100
    on_command_type: 'brightness'
    payload_on: '{"turn":"on"}'
    payload_off: '{"turn":"off"}'
    brightness_command_template: '{"turn":"on","brightness":{{ value }}}'
    device: *f008d1c578c8

  - name: "Licht 3" # Ausgaung 3
    unique_id: "dingz_f008d1c578c8_light_2"
    state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/2"
    command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/2"
    state_value_template: '{"turn":"{{ value_json.turn }}"}'
    brightness_state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/2"
    brightness_command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/2"
    brightness_value_template: "{{ value_json.brightness }}"
    brightness_scale: 100
    on_command_type: 'brightness'
    payload_on: '{"turn":"on"}'
    payload_off: '{"turn":"off"}'
    brightness_command_template: '{"turn":"on","brightness":{{ value }}}'
    device: *f008d1c578c8

  - name: "Licht 4" # Ausgaung 4
    unique_id: "dingz_f008d1c578c8_light_3"
    state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/3"
    command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/3"
    state_value_template: '{"turn":"{{ value_json.turn }}"}'
    brightness_state_topic: "dingz/f008d1c578c8/dz1f-pir/state/light/3"
    brightness_command_topic: "dingz/f008d1c578c8/dz1f-pir/command/light/3"
    brightness_value_template: "{{ value_json.brightness }}"
    brightness_scale: 100
    on_command_type: 'brightness'
    payload_on: '{"turn":"on"}'
    payload_off: '{"turn":"off"}'
    brightness_command_template: '{"turn":"on","brightness":{{ value }}}'
    device: *f008d1c578c8

